<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Página en mantenimiento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(rgba(7,12,20,.85),rgba(7,12,20,.92)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420") center/cover;

overflow:hidden;

color:white;

}

body::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:#2dd4bf;

filter:blur(220px);

opacity:.12;

animation:pulse 6s ease-in-out infinite;

}

@keyframes pulse{

0%{transform:scale(.9);}
50%{transform:scale(1.15);}
100%{transform:scale(.9);}

}

.card{

position:relative;

width:700px;

padding:60px;

text-align:center;

background:rgba(20,25,35,.65);

backdrop-filter:blur(16px);

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

box-shadow:0 20px 50px rgba(0,0,0,.45);

}

.logo{

font-size:42px;

font-weight:700;

letter-spacing:2px;

color:#2dd4bf;

margin-bottom:25px;

}

.icon{

font-size:70px;

margin-bottom:20px;

animation:float 2s ease-in-out infinite;

}

@keyframes float{

50%{

transform:translateY(-10px);

}

}

h1{

font-size:42px;

margin-bottom:15px;

}

p{

color:#c8d1dc;

font-size:18px;

line-height:1.8;

margin-bottom:35px;

}

.discord{

display:inline-block;

padding:16px 45px;

background:#2dd4bf;

color:#0f172a;

font-weight:700;

text-decoration:none;

border-radius:12px;

transition:.25s;

}

.discord:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(45,212,191,.35);

}

.footer{

margin-top:40px;

font-size:14px;

color:#94a3b8;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
NEXUS ROLEPLAY
</div>

<div class="icon">
🚧
</div>

<h1>Página en mantenimiento</h1>

<p>

Estamos realizando mejoras para ofrecerte una experiencia mucho mejor.
Nuestro equipo está trabajando para que todo vuelva a estar disponible lo antes posible.

</p>

<a class="discord" href="https://discord.gg/TUINVITACION">

Unirse al Discord

</a>

<div class="footer">

© 2026 Nexus Roleplay

</div>

</div>

</body>

</html>
